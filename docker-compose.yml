version: '3.8'

services:
  # -------------------------------------------------------------
  # Managed PostgreSQL 15 Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: agency_tracker_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AgencySecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-agency_tracker_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency_admin -d agency_tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Backend API & Durable Background Queue Service
  # -------------------------------------------------------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agency_tracker_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-agency_admin}:${POSTGRES_PASSWORD:-AgencySecure2026!}@postgres:5432/${POSTGRES_DB:-agency_tracker_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production-secure-random-jwt-secret-replace-in-env}
      JWT_EXPIRES_IN: 8h
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@agencytracker.io}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # Production Frontend UI Service (Nginx SPA)
  # -------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agency_tracker_client
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local

